<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>All 60+ Client Projects | Anand Hyalij — Shopify & Front-End Developer</title>
    
    <link rel="icon" type="image/x-icon" href="./image/Ah2.png" />
    <link rel="stylesheet" type="text/css" href="./style.css" />
    <script src="https://kit.fontawesome.com/307a8342e4.js" crossorigin="anonymous"></script>
    <style>
      .projects-hero-banner {
        padding: 120px 0 60px;
        background: linear-gradient(180deg, #111116 0%, #09090b 100%);
        border-bottom: 1px solid var(--border-subtle);
        text-align: center;
      }
    </style>
  </head>
  <body>
    
    <!-- Navigation Bar -->
    <header class="site-header">
      <div class="container header-container">
        <a href="index.html" class="brand-logo">
          <img src="./image/Ah2.png" alt="Anand Hyalij" />
          <span>Anand Hyalij</span>
        </a>

        <a href="index.html" class="btn-secondary" style="padding: 8px 18px; font-size: 14px;">
          <i class="fa-solid fa-arrow-left"></i> Back to Main Portfolio
        </a>
      </div>
    </header>

    <!-- Hero Banner -->
    <div class="projects-hero-banner">
      <div class="container">
        <span class="section-badge"><i class="fa-solid fa-store"></i> Real-World eCommerce Showcase</span>
        <h1 class="section-title">All <span class="text-gradient">60+ Client Projects</span></h1>
        <p class="section-subtitle" style="margin: 0 auto 24px;">Complete collection of live Shopify stores, E-Commerce platforms, and custom web applications developed or customized by Anand Hyalij.</p>
      </div>
    </div>

    <!-- Main Content Container -->
    <div class="container" style="padding-top: 60px; padding-bottom: 100px;">
      
      <!-- Controls -->
      <div class="portfolio-controls" style="margin-bottom: 48px;">
        <div class="search-input-wrapper" style="max-width: 600px;">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" id="fullSearch" class="portfolio-search-input" placeholder="Search 60+ projects by brand name, technology, or market..." onkeyup="filterFullProjects()" />
        </div>

        <div class="filter-pills-flex" id="pillsContainer">
          <button class="filter-pill active" onclick="setFullFilter('all', this)">All Projects (60)</button>
          <button class="filter-pill" onclick="setFullFilter('fashion', this)">Fashion & Apparel</button>
          <button class="filter-pill" onclick="setFullFilter('beauty', this)">Beauty & Skincare</button>
          <button class="filter-pill" onclick="setFullFilter('food', this)">Food & Organics</button>
          <button class="filter-pill" onclick="setFullFilter('home', this)">Home & Living</button>
          <button class="filter-pill" onclick="setFullFilter('gifting', this)">Gifting</button>
          <button class="filter-pill" onclick="setFullFilter('wholesale', this)">B2B / Wholesale</button>
        </div>
      </div>

      <!-- Projects Grid -->
      <div class="projects-grid-layout" id="fullGrid">
        <!-- Generated via Script -->
      </div>
    </div>

    <!-- Footer -->
    <footer class="site-footer">
      <div class="container" style="text-align: center;">
        <p style="color: var(--text-subtle); font-size: 14px;">Copyright © 2026 Anand Hyalij | Senior Shopify & Front-End Developer</p>
      </div>
    </footer>

    <!-- Master Dataset -->
    <script src="./js/projects-data.js"></script>

    <script>
      let fullFilterCat = 'all';

      document.addEventListener('DOMContentLoaded', () => {
        renderFullProjects();
      });

      function handleImgError(img, url, domain, name) {
        const step = parseInt(img.dataset.step || "0");
        if (step === 0) {
          img.dataset.step = "1";
          img.src = `https://api.microlink.io/?url=${encodeURIComponent(url)}&screenshot=true&embed=screenshot.url`;
        } else if (step === 1) {
          img.dataset.step = "2";
          img.src = `https://image.thum.io/get/width/600/crop/400/${url}`;
        } else {
          const wrapper = img.closest('.project-img-wrapper');
          wrapper.innerHTML = `
            <div class="brand-fallback-view" style="width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; background:linear-gradient(135deg,#1c1c2e,#151b29); padding:20px; text-align:center;">
              <img src="https://www.google.com/s2/favicons?domain=${domain}&sz=128" style="width:44px; height:44px; border-radius:8px; margin-bottom:8px;" alt="${name} logo" onerror="this.style.display='none';" />
              <div style="font-size:16px; font-weight:600; color:#fff;">${name}</div>
              <div style="font-size:12px; color:var(--accent-blue); margin-top:4px;">${domain}</div>
            </div>
          `;
        }
      }

      function renderFullProjects() {
        const grid = document.getElementById('fullGrid');
        const searchVal = document.getElementById('fullSearch').value.toLowerCase();

        let filtered = projectsData.filter(p => {
          const matchCat = fullFilterCat === 'all' || p.category === fullFilterCat;
          const matchSearch = p.name.toLowerCase().includes(searchVal) || 
                              p.domain.toLowerCase().includes(searchVal) || 
                              p.technology.some(t => t.toLowerCase().includes(searchVal));
          return matchCat && matchSearch;
        });

        if (filtered.length === 0) {
          grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 40px;">No projects found matching your search.</div>`;
          return;
        }

        let html = '';
        filtered.forEach(p => {
          let initialImgSrc = p.img;
          if (!initialImgSrc) {
            initialImgSrc = `https://s.wordpress.com/mshots/v1/${encodeURIComponent(p.url)}?w=800&h=500`;
          }

          const techBadges = p.technology.map(t => `<span class="tech-tag-item">${t}</span>`).join('');

          html += `
            <div class="project-browser-card">
              <div class="browser-bar">
                <div class="browser-dots">
                  <div class="b-dot r"></div>
                  <div class="b-dot y"></div>
                  <div class="b-dot g"></div>
                </div>
                <div class="browser-address">
                  <i class="fa-solid fa-lock" style="font-size: 9px;"></i> ${p.url}
                </div>
              </div>

              <div class="project-img-wrapper">
                <img 
                  src="${initialImgSrc}" 
                  alt="${p.name} Homepage Preview" 
                  loading="lazy"
                  data-step="0"
                  onerror="handleImgError(this, '${p.url}', '${p.domain}', '${p.name.replace(/'/g, "\\'")}')"
                />
              </div>

              <div class="project-card-body">
                <div>
                  <div class="project-meta-top">
                    <h3 class="project-title">${p.name}</h3>
                    <span class="project-tag">${p.platform}</span>
                  </div>
                  <div class="project-desc">${p.description}</div>
                  <div class="project-tech-tags">${techBadges}</div>
                </div>

                <div>
                  <a href="${p.url}" target="_blank" class="btn-card-visit" style="width: 100%;">
                    Visit Store <i class="fa-solid fa-arrow-up-right-from-square"></i>
                  </a>
                </div>
              </div>
            </div>
          `;
        });

        grid.innerHTML = html;
      }

      function setFullFilter(cat, btn) {
        fullFilterCat = cat;
        document.querySelectorAll('.filter-pill').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderFullProjects();
      }

      function filterFullProjects() {
        renderFullProjects();
      }
    </script>
  </body>
</html>
